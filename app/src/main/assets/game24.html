<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>算24点</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--ink:#e2e8f0;--dim:#94a3b8;
        --accent:#38bdf8;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 50% -10%,#1e3a8a33,var(--bg));color:var(--ink);
        font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{display:flex;justify-content:center;}
  .app{width:100%;max-width:520px;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;}
  h1{font-size:22px;margin:2px 0 0;text-align:center;letter-spacing:2px;}
  .sub{text-align:center;color:var(--dim);font-size:13px;}
  .bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .chip{background:var(--card);border:1px solid #334155;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);}
  .chip b{color:var(--ink);}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .card{aspect-ratio:3/4;border:none;border-radius:14px;font-size:clamp(26px,9vw,44px);font-weight:800;color:#0b1220;
        background:linear-gradient(160deg,#e0f2fe,#bae6fd);box-shadow:0 6px 0 #0284c7,0 10px 18px #0006;cursor:pointer;}
  .card.used{filter:grayscale(1) brightness(.55);box-shadow:0 2px 0 #334155;transform:translateY(4px);cursor:default;}
  .expr{min-height:54px;background:var(--card);border:1px solid #334155;border-radius:14px;padding:10px 12px;font-size:24px;
        display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-all;}
  .expr .ph{color:#475569;}
  .msg{min-height:22px;text-align:center;font-size:15px;}
  .msg.good{color:var(--good);font-weight:700;} .msg.bad{color:var(--bad);} .msg.warn{color:var(--warn);}
  .ops{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .ops button{height:52px;border:none;border-radius:12px;font-size:24px;font-weight:800;background:var(--card2);color:var(--ink);
        box-shadow:0 4px 0 #0b1220;cursor:pointer;}
  .ops button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1220;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .row button{height:44px;border:1px solid #334155;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px;cursor:pointer;}
  .row button:active{transform:translateY(2px);}
  .hint{margin-top:2px;text-align:center;color:var(--dim);font-size:14px;min-height:20px;}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9;}
  .confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}
  .foot{text-align:center;color:#64748b;font-size:12px;}
</style>
</head>
<body>
<div class="app">
  <h1>算 24 点</h1>
  <div class="sub">用 + − × ÷ 和括号，把 4 个数各用一次，凑成 24</div>
  <div class="bar">
    <span class="chip">解出 <b id="solved">0</b> 局</span>
    <span class="chip">连胜 <b id="streak">0</b></span>
    <span class="chip">用时 <b id="timer">0.0</b>s</span>
    <label class="chip"><input type="checkbox" id="allowUnsolvable"> 挑战(允许无解)</label>
  </div>
  <div class="cards" id="cards"></div>
  <div class="expr" id="expr"><span class="ph">点下面按钮组成算式…</span></div>
  <div class="msg" id="msg"></div>
  <div class="ops">
    <button data-op="+">+</button><button data-op="−">−</button>
    <button data-op="×">×</button><button data-op="÷">÷</button>
  </div>
  <div class="row">
    <button id="lparen">(</button><button id="rparen">)</button>
    <button id="undo">撤销</button><button id="clear">清空</button>
  </div>
  <div class="row">
    <button id="equal">= 24 ?</button><button id="hint">提示</button>
    <button id="new">换一组</button><button id="reveal">看答案</button>
  </div>
  <div class="hint" id="hintText"></div>
  <div class="foot">完全离线 · 判定用精确分数，不靠浮点</div>
</div>
<div class="confetti" id="confetti"></div>

<script>
"use strict";
/* ---------- 精确分数 ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function norm(f){let [n,d]=f;if(d<0){n=-n;d=-d;}const g=gcd(n,d);return [n/g,d/g];}
const add=(a,b)=>norm([a[0]*b[1]+b[0]*a[1], a[1]*b[1]]);
const sub=(a,b)=>norm([a[0]*b[1]-b[0]*a[1], a[1]*b[1]]);
const mul=(a,b)=>norm([a[0]*b[0], a[1]*b[1]]);
const div=(a,b)=>b[0]===0?null:norm([a[0]*b[1], a[1]*b[0]]);
const feq=(a,b)=>a[0]===b[0]&&a[1]===b[1];
const fstr=f=>f[1]===1?String(f[0]):(f[0]+'/'+f[1]);
const INT=x=>norm([x,1]);

/* ---------- 24 点求解（DFS，返回一个解的字符串或 null） ---------- */
function solve(nums){ // nums: [{v:[n,d], e:string}]
  if(nums.length===1) return feq(nums[0].v,[24,1]) ? strip1(nums[0].e) : null;
  for(let i=0;i<nums.length;i++) for(let j=0;j<nums.length;j++){
    if(i===j) continue;
    const a=nums[i], b=nums[j];
    const ops=[[add,'+'],[sub,'−'],[mul,'×'],[div,'÷']];
    for(const [fn,sym] of ops){
      const r=fn(a.v,b.v); if(r===null) continue;
      const rest=nums.filter((_,k)=>k!==i&&k!==j);
      const cand=solve(rest.concat([{v:r, e:'('+a.e+sym+b.e+')'}]));
      if(cand) return cand;
    }
  }
  return null;
}
const strip1=s=>s.startsWith('(')&&s.endsWith(')')?s.slice(1,-1):s;

/* ---------- 出題：默认可解 ---------- */
const rnd=()=>1+Math.floor(Math.random()*13);
let cards=[];
function deal(){
  const allow=document.getElementById('allowUnsolvable').checked;
  for(let t=0;t<2000;t++){
    const c=[rnd(),rnd(),rnd(),rnd()];
    if(allow || c.some((_,i,a)=>solve(a.map(v=>({v:INT(v),e:String(v)}))))){cards=c;break;}
  }
  startTime=performance.now(); running=true;
  exprTokens.length=0; usedIdx=new Set(); hintText.textContent='';
  msg('',''); renderCards(); renderExpr(); updateStats();
}

/* ---------- 表达式构建与求值（shunting-yard，仅二元 + - × ÷ 与括号） ---------- */
let exprTokens=[];           // 元素：{t:'num',v,cardIdx} 或 {t:'op',s} 或 {t:'lp'|'rp'}
let usedIdx=new Set();
let startTime=0,running=false,solved=0,streak=0;
const $=id=>document.getElementById(id);
const exprEl=$('expr'),msgEl=$('msg'),hintText=$('hintText');

function push(tok){
  if(tok.t==='num'){ if(usedIdx.has(tok.cardIdx)) return; usedIdx.add(tok.cardIdx); }
  exprTokens.push(tok); renderCards(); renderExpr(); msg('','');
}
function undo(){
  const t=exprTokens.pop(); if(!t) return;
  if(t.t==='num') usedIdx.delete(t.cardIdx);
  renderCards(); renderExpr();
}
function clearAll(){exprTokens.length=0; usedIdx.clear(); renderCards(); renderExpr(); msg('','');}
const sym2op={'+':add,'−':sub,'×':mul,'÷':div};

function evaluate(tokens){
  // 校验 token 序列（不允许一元负号）
  const prec={'+':1,'−':1,'×':2,'÷':2};
  const out=[],ops=[];
  let expectOperand=true;
  for(const t of tokens){
    if(t.t==='num'){ if(!expectOperand) return {err:'两个数之间缺运算符'}; out.push(t); expectOperand=false; }
    else if(t.t==='lp'){ if(!expectOperand) return {err:'左括号前缺运算符'}; ops.push(t); }
    else if(t.t==='rp'){
      if(expectOperand) return {err:'括号内缺数'};
      while(ops.length&&ops[ops.length-1].t!=='lp') out.push(ops.pop());
      if(!ops.length) return {err:'括号不匹配'}; ops.pop(); expectOperand=false;
    } else { // op
      if(expectOperand) return {err:'运算符位置不对（不支持负数）'};
      while(ops.length){const o=ops[ops.length-1];
        if(o.t==='op' && prec[o.s]>=prec[t.s]) out.push(ops.pop()); else break;}
      ops.push(t); expectOperand=true;
    }
  }
  if(expectOperand) return {err:'式子不完整'};
  while(ops.length){const o=ops.pop(); if(o.t==='lp') return {err:'括号不匹配'}; out.push(o);}
  const st=[];
  for(const t of out){
    if(t.t==='num') st.push(INT(t.v));
    else{const b=st.pop(),a=st.pop(); if(a===undefined||b===undefined) return {err:'式子不合法'};
      const r=sym2op[t.s](a,b); if(r===null) return {err:'除以 0 了'}; st.push(r);}
  }
  return st.length===1?{v:st[0]}:{err:'式子不合法'};
}

function check(){
  if(usedIdx.size!==4){msg('bad','4 个数要各用一次（还差 '+(4-usedIdx.size)+' 个）');return;}
  const r=evaluate(exprTokens);
  if(r.err){msg('bad',r.err);return;}
  if(feq(r.v,[24,1])){
    running=false; solved++; streak++;
    const used=((performance.now()-startTime)/1000).toFixed(1);
    msg('good','🎉 正确！24！用时 '+used+'s'); confetti(); updateStats();
  }else{ streak=0; updateStats(); msg('bad','结果是 '+fstr(r.v)+'，还不是 24'); }
}

function renderCards(){
  const box=$('cards'); box.innerHTML='';
  cards.forEach((v,i)=>{
    const b=document.createElement('button'); b.className='card'; b.textContent=v;
    if(usedIdx.has(i)) b.classList.add('used'); else b.onclick=()=>push({t:'num',v,cardIdx:i});
    box.appendChild(b);
  });
}
function renderExpr(){
  if(!exprTokens.length){exprEl.innerHTML='<span class="ph">点下面按钮组成算式…</span>';return;}
  exprEl.textContent=exprTokens.map(t=>t.t==='num'?t.v:t.s).join(' ');
}
function msg(cls,txt){msgEl.className='msg '+cls; msgEl.textContent=txt;}
function updateStats(){$('solved').textContent=solved;$('streak').textContent=streak;}
setInterval(()=>{ if(running) $('timer').textContent=((performance.now()-startTime)/1000).toFixed(1); },100);

function confetti(){
  const box=$('confetti'); const colors=['#38bdf8','#34d399','#fbbf24','#fb7185','#a78bfa'];
  for(let i=0;i<60;i++){const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw'; p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*.3)+'s'; box.appendChild(p); setTimeout(()=>p.remove(),2000);}
}

/* ---------- 事件 ---------- */
document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>push({t:'op',s:b.dataset.op}));
$('lparen').onclick=()=>push({t:'lp'}); $('rparen').onclick=()=>push({t:'rp'});
$('undo').onclick=undo; $('clear').onclick=clearAll; $('equal').onclick=check; $('new').onclick=deal;
$('hint').onclick=()=>{ const s=solve(cards.map(v=>({v:INT(v),e:String(v)})));
  hintText.textContent = s ? ('一组解：'+s) : '这组无解，点「换一组」吧'; };
$('reveal').onclick=$('hint').onclick;

deal();
</script>
</body>
</html>
